<div class="admin-bands">
  <div class="page-header">
    <div class="title-row">
      <mat-icon class="header-icon">tune</mat-icon>
      <h1>ML Risk Bands</h1>
    </div>
    <p class="subtitle">Thresholds for the advisory ML risk chip on fraud holds. Low &lt; Med &lt; High, each in (0, 1).</p>
  </div>

  <div *ngIf="loading" class="loading-state">
    <mat-spinner diameter="28"></mat-spinner><span>Loading…</span>
  </div>

  <div *ngIf="error" class="error-banner" role="alert">{{ error }}</div>

  <div *ngIf="!loading" class="panel">
    <label class="field">
      <span>Med boundary (Low → Med)</span>
      <input type="number" step="0.01" min="0" max="1" [(ngModel)]="med" name="med" />
    </label>
    <label class="field">
      <span>High boundary (Med → High)</span>
      <input type="number" step="0.01" min="0" max="1" [(ngModel)]="high" name="high" />
    </label>
    <p *ngIf="invalid" class="validation-hint" role="alert">Require 0 &lt; Med &lt; High &lt; 1.</p>
    <div class="actions">
      <button class="save-btn" (click)="save()" [disabled]="saving || invalid">
        <mat-icon>save</mat-icon> {{ saving ? 'Saving…' : 'Save' }}
      </button>
      <button class="reset-btn" type="button" (click)="reset()">Reset to defaults</button>
    </div>
    <span class="updated" *ngIf="updatedAt">Last updated {{ updatedAt }}</span>
  </div>
</div>
