<div class="app-container">
    <!-- Top Brand Bar -->
    <mat-toolbar class="brand-bar">
        <button mat-icon-button (click)="toggleSidebar()" class="sidebar-toggle">
            <mat-icon>menu</mat-icon>
        </button>
        <span class="brand-name">BankOps Portal</span>
        <span class="spacer"></span>
        <button mat-icon-button>
            <mat-icon>account_circle</mat-icon>
        </button>
    </mat-toolbar>

    <!-- Sidebar + Content -->
    <mat-sidenav-container class="sidenav-container">
        <mat-sidenav mode="side" opened [class.collapsed]="sidebarCollapsed" class="sidebar">
            <mat-nav-list>
                <a mat-list-item routerLink="/customers" routerLinkActive="active"
                    [matTooltip]="sidebarCollapsed ? 'Customers' : ''" matTooltipPosition="right">
                    <mat-icon>people</mat-icon>
                    <span *ngIf="!sidebarCollapsed">Customers</span>
                </a>
                <a mat-list-item routerLink="/cases" routerLinkActive="active"
                    [matTooltip]="sidebarCollapsed ? 'Cases' : ''" matTooltipPosition="right">
                    <mat-icon>support</mat-icon>
                    <span *ngIf="!sidebarCollapsed">Cases</span>
                </a>
                <a mat-list-item routerLink="/incidents" routerLinkActive="active"
                    [matTooltip]="sidebarCollapsed ? 'Incident Console' : ''" matTooltipPosition="right">
                    <mat-icon>bug_report</mat-icon>
                    <span *ngIf="!sidebarCollapsed">Incident Console</span>
                </a>
            </mat-nav-list>
        </mat-sidenav>

        <mat-sidenav-content class="main-content">
            <router-outlet></router-outlet>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
