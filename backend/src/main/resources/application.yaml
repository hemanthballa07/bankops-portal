spring:
  application:
    name: bankops-portal
  
  profiles:
    active: local
  
  datasource:
    url: jdbc:h2:mem:bankopsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.bankops.portal: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId:-}/%X{spanId:-}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-}/%X{spanId:-}] [%X{correlationId}] %logger{36} - %msg%n"

# Fluxa fraud-eval gRPC client (see com.bankops.portal.config.FluxaProperties).
# Defaults: feature-flag off, shadow-mode on, FAIL_CLOSED withdrawal /
# FAIL_OPEN deposit. Profile overlays in application-{local,test,prod}.yaml
# override these.
bankops:
  fluxa:
    enabled: false
    shadow-mode: true
    host: localhost
    port: 9095
    deadline: PT0.3S
    withdrawal: FAIL_CLOSED
    deposit: FAIL_OPEN
  # Fluxguard rate-limit gRPC client (see com.bankops.portal.config.FluxguardProperties).
  # Defaults: feature-flag off. Rate limiting is unconditionally fail-open — a
  # fluxguard outage never blocks a transaction. Profile overlays override these.
  fluxguard:
    enabled: false
    host: localhost
    port: 9099
    deadline: PT0.15S

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 0.0

---
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: ${AZURE_SQL_URL}
    username: ${AZURE_SQL_USERNAME}
    password: ${AZURE_SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

logging:
  level:
    root: INFO
    com.bankops.portal: INFO

---
spring:
  config:
    activate:
      on-profile: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: WARN
    com.bankops.portal: DEBUG
