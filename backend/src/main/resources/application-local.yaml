# Local-dev overlay — gate enabled with enforcement (shadow off); fail-open both
# directions to keep dev flowing when fluxa is down.
bankops:
  fluxa:
    enabled: true
    shadow-mode: false
    withdrawal: FAIL_OPEN
    deposit: FAIL_OPEN
    deadline: PT2S

# Distributed tracing: sample everything locally and export to Fluxa's shared
# Jaeger (OTLP/HTTP). Disabled in test; 0% sampling by default.
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
